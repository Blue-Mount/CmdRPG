name: Client validation and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['client-v[0-9]*']
permissions:
  contents: read
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONUTF8: '1'
      - name: Build tagged immutable client
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^client-v([1-9][0-9]*)$') { throw 'Invalid client release tag' }
          python -m tools.release_client --sequence $Matches[1] --output "$env:RUNNER_TEMP\client-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/client-v')
        with:
          name: CmdRPG-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/client-release/
          if-no-files-found: error
